<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>invest</title>
    <link rel="stylesheet" href="1st.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
<div class="container">
<aside>

            <img src="logo.svg" class="logo" alt="iintoo logo" id="logo-onbg">    

            <img src="bg.jpg" class="left" alt="iintoo picture" id="bg">

             
</aside>
              <div class="right">
    <h1 class="get-iinto">Get iinto it today</h1>
    <p class="no-obligation">There is no charge or obligation upon registration.</p>
    <div class="social-buttons">
<button type="button" class="facebook-button">
    <img src="facebook.svg" alt="Facebook Logo" class="facebook-logo">
    <span>Register with Facebook</span>
</button>
<button type="button" class="linkedin-button">
    <img src="linkedin.svg" alt="Linkedin Logo" class="linkedin-logo">
    <span>Register with Linkedin</span>
</button>
               </div>
               
<div class="or">
    <span></span>
    <p>OR</p>
    <span></span>
</div>

<form>
       <div class="inputs">
    <div class="input-email">
        <label>Email</label>
        <input class="email-input" type="email">
    </div>
    <div class="input-phone">
        <label>Phone</label>
        <input class="phone-input" type="phone">
        </div>
    </div>


    <h1 class="what-type">What type of investor are you?</h1>
    <p class="select-type">Select the type of investor you are below.</p>

    
        <div class="investor-type">
        <div>
            <input type="radio" class="Individual" id="Individual" name="investor-type" value="individual">
            <label for="Individual">Individual</label>
            <small>ⓘ</small>
        </div>
        <div>
            <input type="radio" id="Business" name="investor-type" value="business">
            <label for="Business">Business</label>
            <small>ⓘ</small>
        </div>
        <div>
            <input type="radio" id="IRA" name="investor-type" value="ira">
            <label for="IRA">IRA</label>
            <small>ⓘ</small>
        </div>
        <div>
            <input type="radio" id="Trust" name="investor-type" value="trust">
            <label for="Trust">Trust</label>
            <small>ⓘ</small>
        </div>
        </div>

        <p class="description">
    I am a natural person investing on my
    own behalf as a sole owner, joint tenant,
    or tenant in common.
        </p>

            <label class="terms">
    <input type="checkbox">
    <span>
        I agree to the terms and receiving notifications from iintoo
        <a href="#">View full terms</a>
    </span>
            </label>

        <button type="button" class="create-account">
    <span>Create Account</span>
        </button>

    
    </form>
</div>


</div>
</body>
</html>
